name: Grrrol

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - CustomSprites/Grrrol/**.*
    tags:
      - '*'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compress
        run: zip -r Grrrol.zip CustomSprites/Grrrol

      - name: Create / Edit Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Grrrol
          tag: Grrrol
          allowUpdates: true
          replacesArtifacts: true
          bodyFile: CustomSprites/Grrrol/README.md
          artifacts: Grrrol.zip
          artifactContentType: application/zip
